name: Build mount package
on:
  workflow_dispatch:
    inputs:
      publish_draft:
        description: Also create a draft release (otherwise build artifacts only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mount-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build offline translations
        shell: pwsh
        run: |
          python tools/build_localization.py
          if ($LASTEXITCODE) { throw 'Translation compilation failed' }
          git diff --exit-code -- Scripts/translations.lua
          if ($LASTEXITCODE) { throw 'Commit the generated translations before releasing' }
      - name: Build and verify package
        shell: pwsh
        run: ./tools/Build-Release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rideable-Mount-Companions
          path: dist/*
          if-no-files-found: error
      - name: Create optional draft
        if: inputs.publish_draft && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          gh release create "v$version" --draft --target '${{ github.sha }}' --title "Rideable Mount Companions $version" --notes-file docs/RELEASE.md dist/*.zip dist/SHA256SUMS.txt
          if ($LASTEXITCODE) { throw 'Draft release failed' }
